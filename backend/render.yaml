# Use `prisma migrate deploy` on Render (not `db push`). Migrations dedupe TaskAttachment
# rows before adding @@unique([taskId, fileNodeId]); `db push` cannot run that SQL and will fail or require --accept-data-loss.
services:
  - type: web
    name: taskmanager-api
    runtime: node
    buildCommand: npm install && node node_modules/prisma/build/index.js generate && node node_modules/prisma/build/index.js migrate deploy && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: GEMINI_PROXY_URL
        sync: false
      - key: PORT
        value: 3000